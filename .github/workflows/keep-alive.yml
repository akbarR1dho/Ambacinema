name: Keep Alive Supabase & Vercel

on:
  schedule:
    # Berjalan setiap hari pada jam 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * *'
  # Memungkinkan workflow dijalankan secara manual dari tab Actions
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Ping Keep-Alive Endpoint & Cek Status HTTP
        run: |
          URL="https://ambacinema.vercel.app/keep-alive"
          echo "Melakukan ping ke $URL..."
          
          # Mengambil kode status HTTP dan menyimpan isi respons ke file sementara
          HTTP_STATUS=$(curl -s -L -o response.txt -w "%{http_code}" "$URL")
          
          echo "Status HTTP yang diterima: $HTTP_STATUS"
          echo "Isi Respons:"
          cat response.txt
          echo ""
          
          # Gagalkan workflow jika status bukan 200 OK
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Ping gagal! Endpoint mengembalikan status HTTP $HTTP_STATUS (bukan 200 OK)."
            exit 1
          fi
          
          echo "Ping berhasil dengan status 200 OK!"

      - name: Cegah Penonaktifan Workflow Otomatis (GitHub CLI)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT /repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable
          echo "Status aktif workflow berhasil diperbarui."
